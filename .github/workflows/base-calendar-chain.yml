name: "Carga del calendario de base (cadena)"

# Carga inicial del calendario de base: cada ejecución pide como mucho 1500 peticiones (~75 min, 3 s entre peticiones)
# y solo las jornadas que faltan. Si la pasada agota el tope, se vuelve a lanzar sola; si termina por debajo del tope
# (ya no queda nada que pedir) o falla, la cadena se detiene: sin reintentos ni ejecuciones en cola.
# Solo manual: no tiene `schedule`.
on:
  workflow_dispatch:
    inputs:
      pass:
        description: Número de pasada (la cadena lo incrementa sola)
        default: "1"

concurrency:
  # Grupo propio: no bloquea ni el directo de senior ni el de base (scrape-rffm-base), que corren en paralelo.
  group: scrape-rffm-base-chain
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: vars.RFFM_ADAPTER_DISABLED != 'true'
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt
      - run: pip install -r requirements.txt
      - name: Calendario de base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SCRAPER_CACHE_DIR: .cache
          SCRAPER_MIN_INTERVAL: "3"
        run: python run.py --job base_calendar --max-requests 1500 --max-minutes 100
      - name: ¿Queda calendario por cargar?
        id: seguir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python chain_check.py >> "$GITHUB_OUTPUT"
      - name: Lanzar la siguiente pasada
        if: steps.seguir.outputs.continuar == 'true' && fromJSON(inputs.pass) < 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run base-calendar-chain.yml --ref "${{ github.ref_name }}" -f pass=$(( ${{ inputs.pass }} + 1 ))
